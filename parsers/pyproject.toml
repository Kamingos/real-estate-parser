[project]
name = "parsers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Evgeniy", email = "gooaal.j@mail.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bs4>=0.0.2",
    "dadata>=25.10.0",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "requests>=2.34.2",
    "selenium>=4.51.0",
    "typedict>=0.1.0",
]

[project.scripts]
parsers = "parsers:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E7", "E9", "F", "I"]
# E402: module level import not at top of file (docstring before import is intentional)
ignore = ["E402"]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
